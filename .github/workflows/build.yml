name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # ponytail: one native job per arch instead of a universal app; a fat PyInstaller backend
    # would need lipo on every .so/dylib plus a universal2 Python, for no user-visible gain
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            dmg_arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            dmg_arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies (macOS)
        run: |
          brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download ASR models
        run: |
          python scripts/download_models.py

      - name: Build backend distribution (${{ matrix.arch }})
        run: |
          bash scripts/build_backend.sh

      - name: Debug backend output
        run: |
          echo "=== Backend build output ==="
          ls -la tauri_backend_dist/ || echo "tauri_backend_dist not found"
          ls -la tauri_backend_dist/backend/ || echo "tauri_backend_dist/backend not found"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy logo to dist
        run: cp echo_logo.svg frontend/dist/

      - name: Install Tauri dependencies
        working-directory: tauri
        run: npm install

      - name: Prepare backend for bundling
        run: |
          rm -rf tauri/src-tauri/backend
          cp -r tauri_backend_dist/backend tauri/src-tauri/
          echo "=== Backend bundle contents ==="
          ls -la tauri/src-tauri/backend/
          du -sh tauri/src-tauri/backend/

      - name: Build Tauri app (${{ matrix.target }})
        working-directory: tauri
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npm run build -- --target ${{ matrix.target }} --bundles app

      - name: Verify every bundled binary is ${{ matrix.arch }}
        run: |
          APP="tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/EchoSmith.app"
          BACKEND="$APP/Contents/Resources/backend"
          fail=0
          for f in "$APP/Contents/MacOS/EchoSmith" "$BACKEND/backend" \
                   "$BACKEND/_internal/ffmpeg_bin/ffmpeg" "$BACKEND/_internal/ffmpeg_bin/ffprobe" \
                   "$BACKEND/_internal/deno_bin/deno"; do
            [ -f "$f" ] || { echo "ERROR: missing $f"; fail=1; continue; }
            file "$f"; lipo -info "$f"
          done
          # Every Mach-O (dylibs, Python extension .so files) must contain the target arch
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q Mach-O && ! lipo -archs "$f" | grep -qw "${{ matrix.arch }}"; then
              echo "ERROR: $f is $(lipo -archs "$f"), expected ${{ matrix.arch }}"; fail=1
            fi
          done < <(find "$APP" -type f -print0)
          [ "$fail" = 0 ]
          # Natively executable on this runner, with the rewritten dylib paths
          "$BACKEND/_internal/ffmpeg_bin/ffmpeg" -version | head -1
          "$BACKEND/_internal/ffmpeg_bin/ffprobe" -version | head -1
          "$BACKEND/_internal/deno_bin/deno" --version

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Create DMG
        run: |
          APP="tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/EchoSmith.app"
          DMG_OUTPUT="tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"

          VERSION=$(grep '"version"' tauri/src-tauri/tauri.conf.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          DMG_NAME="EchoSmith_${VERSION}_${{ matrix.dmg_arch }}.dmg"

          mkdir -p "$DMG_OUTPUT"

          # Use create-dmg for proper DMG with Applications link
          create-dmg \
            --volname "EchoSmith" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "EchoSmith.app" 180 170 \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "$DMG_OUTPUT/$DMG_NAME" \
            "$APP"

          echo "DMG created: $DMG_OUTPUT/$DMG_NAME"
          ls -la "$DMG_OUTPUT/"

      - name: Upload artifacts (${{ matrix.dmg_arch }})
        uses: actions/upload-artifact@v4
        with:
          name: echosmith-macos-${{ matrix.dmg_arch }}
          path: tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install ffmpeg (Windows)
        shell: pwsh
        run: |
          # Download static ffmpeg instead of choco (choco installs shims that can't be bundled)
          $FfmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $ZipPath = "$env:TEMP\ffmpeg.zip"
          $ExtractDir = "$env:TEMP\ffmpeg-extract"
          $InstallDir = "C:\ffmpeg"
          Write-Host "Downloading static ffmpeg..."
          Invoke-WebRequest -Uri $FfmpegUrl -OutFile $ZipPath
          Expand-Archive -Path $ZipPath -DestinationPath $ExtractDir -Force
          $BinDir = (Get-ChildItem $ExtractDir -Directory | Select-Object -First 1).FullName + "\bin"
          New-Item -ItemType Directory -Path $InstallDir -Force | Out-Null
          Copy-Item "$BinDir\ffmpeg.exe" $InstallDir
          Copy-Item "$BinDir\ffprobe.exe" $InstallDir
          Write-Host "Installed ffmpeg to $InstallDir"
          Get-ChildItem $InstallDir | ForEach-Object { Write-Host "  $($_.Name): $([math]::Round($_.Length/1MB))MB" }
          # Add to PATH for build_backend.ps1
          echo "$InstallDir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download ASR models
        run: |
          python scripts/download_models.py

      - name: Build backend distribution (Windows)
        shell: pwsh
        run: |
          .\scripts\build_backend.ps1

      - name: Debug backend output
        shell: bash
        run: |
          echo "=== Backend build output ==="
          ls -la tauri_backend_dist/ || echo "tauri_backend_dist not found"
          ls -la tauri_backend_dist/backend/ || echo "tauri_backend_dist/backend not found"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy logo to dist
        shell: bash
        run: cp echo_logo.svg frontend/dist/

      - name: Install Tauri dependencies
        working-directory: tauri
        run: npm install

      - name: Prepare backend for bundling
        shell: bash
        run: |
          rm -rf tauri/src-tauri/backend
          cp -r tauri_backend_dist/backend tauri/src-tauri/
          echo "=== Backend bundle contents ==="
          ls -la tauri/src-tauri/backend/
          du -sh tauri/src-tauri/backend/

      - name: Build Tauri app
        working-directory: tauri
        run: npm run build

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: echosmith-windows
          path: |
            tauri/src-tauri/target/release/bundle/msi/*.msi
            tauri/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find . -type f -name "*.dmg" -o -name "*.msi" -o -name "*.exe" | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            echosmith-macos-*/*
            echosmith-windows/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
